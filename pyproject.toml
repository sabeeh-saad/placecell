[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "placecell"
version = "0.0.1"
description = "Long-term visual memory for mobile robots: record what the robot sees, retrieve it by meaning, time and place."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Sabeeh ul Hassan Saad"}]
keywords = ["robotics", "memory", "embeddings", "retrieval", "ros2", "navigation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
video = ["opencv-python-headless>=4.8"]
lancedb = ["lancedb>=0.25", "pyarrow>=15"]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.6", "mypy>=1.10", "pre-commit>=3"]

[project.scripts]
placecell-ros2 = "placecell.ros2.node:main"

[project.urls]
Homepage = "https://github.com/sabeeh-saad/placecell"
Issues = "https://github.com/sabeeh-saad/placecell/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
placecell = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "S", "C4", "PIE", "PTH", "T20"]
ignore = ["S101"]  # asserts are how tests speak

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # fake keys in tests

[tool.mypy]
strict = true
warn_unreachable = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*", "lancedb", "lancedb.*", "pyarrow", "pyarrow.*", "rclpy", "rclpy.*", "sensor_msgs.*", "std_msgs.*", "tf2_ros", "tf2_ros.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "placecell.ros2.node"
disallow_subclassing_any = false  # rclpy.node.Node ships no stubs

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["placecell"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\.$"]
