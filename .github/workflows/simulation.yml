name: simulation

"on":
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  office:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build ROS and Gazebo
        run: simulation/sim build
      - name: Validate offline ROS operator and reconnect contracts
        run: simulation/sim check-operator
      - name: Validate cancellation ownership and latency under ROS callback load
        run: simulation/sim check-cancel
      - name: Validate sensor and clock faults through the ROS node
        run: simulation/sim check-sensors
      - name: Start the office
        run: simulation/sim start
      - name: Validate sensors, movement and command timeout
        run: simulation/sim check
      - name: Start a fresh world with AMCL and Nav2
        run: simulation/sim start-nav
      - name: Validate localization and planned navigation
        run: simulation/sim check-nav
      - name: Collect simulator logs
        if: always()
        run: |
          mkdir -p simulation/artifacts
          docker compose -f simulation/compose.yaml logs --no-color > simulation/artifacts/simulator.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gazebo-office
          path: simulation/artifacts/
      - name: Stop the office
        if: always()
        run: simulation/sim stop
