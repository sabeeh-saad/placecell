name: simulation

"on":
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Offline ROS checks only; the Gazebo run is on demand in e2e.yml.
jobs:
  offline-ros:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build ROS and Gazebo
        run: simulation/sim build
      - name: Validate offline ROS operator and reconnect contracts
        run: simulation/sim check-operator
      - name: Validate cancellation ownership and latency under ROS callback load
        run: simulation/sim check-cancel
      - name: Validate sensor and clock faults through the ROS node
        run: simulation/sim check-sensors
      - name: Validate persistent retention and evidence ownership
        run: simulation/sim check-retention
      - name: Validate bounded overload and cancellation during saturation
        run: simulation/sim check-overload --samples 100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ros-offline-checks
          path: simulation/artifacts/
          if-no-files-found: warn
