name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,video,lancedb]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov --cov-report=term-missing
      - name: Offline fault contracts
        if: always()
        run: python -m placecell.fault_injection --output fault-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fault-report-python-${{ matrix.python-version }}
          path: fault-report.json
          if-no-files-found: warn
