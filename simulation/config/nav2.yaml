# Overrides for the installed Jazzy bringup defaults. All velocities match the robot.
amcl:
  ros__parameters:
    base_frame_id: base_footprint
    set_initial_pose: false
    resample_interval: 1
    # Wheel odometry is nearly exact here; the map is sampled at 2.5 cm.
    alpha1: 0.02
    alpha2: 0.02
    alpha3: 0.02
    alpha4: 0.02
    alpha5: 0.02
    sigma_hit: 0.15
    update_min_d: 0.05
    update_min_a: 0.05
    min_particles: 500
    max_particles: 1500
    transform_tolerance: 1.0
controller_server:
  ros__parameters:
    controller_frequency: 15.0
    enable_stamped_cmd_vel: false
    progress_checker:
      required_movement_radius: 0.15
      movement_time_allowance: 30.0
    general_goal_checker:
      xy_goal_tolerance: 0.07
      yaw_goal_tolerance: 0.07
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.25
      lookahead_dist: 0.5
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.8
      rotate_to_heading_angular_vel: 0.5
      max_angular_accel: 1.0
      use_rotate_to_heading: true
      use_velocity_scaled_lookahead_dist: false
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_speed: 0.08
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      transform_tolerance: 0.5
local_costmap:
  local_costmap:
    ros__parameters:
      footprint: '[[0.24, 0.23], [0.24, -0.23], [-0.24, -0.23], [-0.24, 0.23]]'
      update_frequency: 5.0
      publish_frequency: 5.0
      resolution: 0.05
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan: {topic: /scan, data_type: LaserScan, clearing: true, marking: true, obstacle_max_range: 10.0, raytrace_max_range: 12.0}
      inflation_layer: {inflation_radius: 0.5, cost_scaling_factor: 3.0}
      always_send_full_costmap: true
global_costmap:
  global_costmap:
    ros__parameters:
      footprint: '[[0.24, 0.23], [0.24, -0.23], [-0.24, -0.23], [-0.24, 0.23]]'
      update_frequency: 2.0
      publish_frequency: 2.0
      resolution: 0.025
      inflation_layer: {inflation_radius: 0.5, cost_scaling_factor: 3.0}
      always_send_full_costmap: true
velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: false
    max_velocity: [0.3, 0.0, 0.7]
    min_velocity: [-0.2, 0.0, -0.7]
    max_accel: [0.5, 0.0, 1.0]
    max_decel: [-0.5, 0.0, -1.0]
behavior_server:
  ros__parameters:
    enable_stamped_cmd_vel: false
    max_rotational_vel: 0.6
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.0
collision_monitor:
  ros__parameters:
    enable_stamped_cmd_vel: false
